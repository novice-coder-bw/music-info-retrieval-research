# Secrets needed:
# None (all services run locally in GitHub Actions service containers)

name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mirr
          POSTGRES_PASSWORD: mirrpassword
          POSTGRES_DB: mirr
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://mirr:mirrpassword@localhost:5432/mirr
      REDIS_URL: redis://localhost:6379/0
      CELERY_EAGER: "1"
      ALLOW_PLACEHOLDER_STEMS: "1"
      R2_ENDPOINT: mock://r2
      R2_BUCKET: music-info-retrieval-research-1
      R2_ACCESS_KEY_ID: mock-key
      R2_SECRET_ACCESS_KEY: mock-secret
      R2_PUBLIC_BASE_URL: https://pub-mock.r2.dev

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -r requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Alembic migrations
        run: |
          alembic upgrade head

      - name: Check for model/migration drift
        run: |
          alembic check

      - name: Run Pytest
        run: |
          pytest -q
