# Secrets needed:
# - DROPLET_HOST: IP or hostname of mirr-server droplet
# - DROPLET_SSH_KEY: Private SSH key for deploy user

name: ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Operation to execute"
        required: true
        type: choice
        options:
          - status
          - logs
          - restart-worker
          - rollback
      lines:
        description: "Log lines to tail (for action: logs)"
        required: false
        default: "200"
        type: string
      tag:
        description: "Tag to restore (for action: rollback)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  run-ops:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      ACTION: ${{ inputs.action }}
      LINES: ${{ inputs.lines }}
      ROLLBACK_TAG: ${{ inputs.tag }}
      DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
      DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "$DROPLET_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DROPLET_HOST" >> ~/.ssh/known_hosts

      - name: Execute action on Droplet
        run: |
          set -euo pipefail
          output=""
          case "$ACTION" in
            status)
              output=$(ssh "deploy@$DROPLET_HOST" "cd /opt/mir && docker compose ps && free -h && df -h /")
              ;;
            logs)
              if [[ ! "$LINES" =~ ^[0-9]+$ ]]; then
                echo "::error::Lines must be a non-negative integer"
                exit 1
              fi
              output=$(ssh "deploy@$DROPLET_HOST" "cd /opt/mir && docker compose logs --tail='$LINES'")
              ;;
            restart-worker)
              output=$(ssh "deploy@$DROPLET_HOST" "cd /opt/mir && docker compose restart worker && docker compose ps worker")
              ;;
            rollback)
              if [[ ! "$ROLLBACK_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
                echo "::error::Invalid rollback tag"
                exit 1
              fi
              output=$(ssh "deploy@$DROPLET_HOST" "bash /opt/mir/release.sh '$ROLLBACK_TAG'")
              ;;
            *)
              echo "::error::Unknown action $ACTION"
              exit 1
              ;;
          esac

          {
            echo "### Ops Action Result: \`$ACTION\`"
            echo '```text'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
