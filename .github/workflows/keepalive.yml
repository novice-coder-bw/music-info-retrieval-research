# Secrets needed:
# - HEALTH_URL: Full URL to https://$DOMAIN/health
# - TELEGRAM_BOT_TOKEN: (Optional) Telegram bot token for failure alerts
# - TELEGRAM_CHAT_ID: (Optional) Telegram chat ID for failure alerts

name: keepalive

on:
  schedule:
    # Runs at 00:00 every 3 days
    - cron: '0 0 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HEALTH_URL: ${{ secrets.HEALTH_URL }}
    steps:
      - name: Ping health endpoint
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "HEALTH_URL secret is not configured; skipping keepalive."
            exit 0
          fi
          curl -fsS "$HEALTH_URL"

      - name: Notify on failure (Telegram)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="🚨 mirr-server keepalive check failed! Health endpoint is unreachable or degraded." || true
          fi
