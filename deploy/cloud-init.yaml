#cloud-config
# mirr-server host bootstrap.
# NO SECRETS HERE: user_data is stored by DigitalOcean and readable from the
# droplet metadata service. Secrets go in /opt/mir/.env after first boot.
#
# The app itself (Caddy, FastAPI, Celery worker, Redis) is deployed later by the
# GitHub Actions deploy workflow, which syncs deploy/ to /opt/mir and runs release.sh.
#
# Block volume: provision-droplet attaches mirr-volume after create. This script
# waits for the device, mounts it at /mnt/mirr-volume (without reformatting),
# ensures fstab, then chowns. If the mount never appears, bootstrap fails so
# the deploy workflow does not hit a silent permission race.

hostname: mirr-server
manage_etc_hosts: true
package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose-v2
  - git
  - curl
  - jq
  - ufw
  - fail2ban
  - unattended-upgrades
  - postgresql-client   # pg_dump / psql for backups

users:
  - name: deploy
    gecos: Deploy user
    shell: /bin/bash
    groups: [docker]
    lock_passwd: true

write_files:
  # Cap container logs so Celery/Demucs output cannot fill the 80 GB disk.
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {"log-driver":"json-file","log-opts":{"max-size":"10m","max-file":"3"}}
  # Redis wants overcommit=1; low swappiness keeps Demucs off swap unless needed.
  - path: /etc/sysctl.d/99-mirr.conf
    permissions: "0644"
    content: |
      vm.overcommit_memory=1
      vm.swappiness=10

runcmd:
  # DigitalOcean injects the chosen SSH keys for root only. Reuse them for the
  # deploy user so both your phone key and the Actions deploy key work.
  - install -d -m 700 -o deploy -g deploy /home/deploy/.ssh
  - [ sh, -c, "[ -s /root/.ssh/authorized_keys ] && install -m 600 -o deploy -g deploy /root/.ssh/authorized_keys /home/deploy/.ssh/authorized_keys || true" ]
  - install -d -o deploy -g deploy /opt/mir

  # --- Persistent volume: wait, mount (no format), fstab, chown, or fail ---
  - [ sh, -c, '
      set -eu
      MNT=/mnt/mirr-volume
      DEV_BY_ID=/dev/disk/by-id/scsi-0DO_Volume_mirr-volume
      LABEL=mirr-volume
      TIMEOUT_SECS=180
      elapsed=0

      mkdir -p "$MNT"

      # Already mounted at the canonical path?
      if mountpoint -q "$MNT"; then
        echo "mirr-volume already mounted at $MNT"
      else
        # Wait for the block device or an auto-mount (DO sometimes mounts first).
        while [ "$elapsed" -lt "$TIMEOUT_SECS" ]; do
          if mountpoint -q "$MNT" || mountpoint -q /mnt/mirr_volume; then
            break
          fi
          if [ -e "$DEV_BY_ID" ] || [ -e /dev/disk/by-label/"$LABEL" ]; then
            break
          fi
          sleep 3
          elapsed=$((elapsed + 3))
        done

        if mountpoint -q /mnt/mirr_volume && ! mountpoint -q "$MNT"; then
          ln -sfn /mnt/mirr_volume "$MNT"
        fi

        if ! mountpoint -q "$MNT"; then
          # Resolve device: prefer by-id, then by-label. Never format.
          DEV=""
          if [ -e "$DEV_BY_ID" ]; then
            DEV=$(readlink -f "$DEV_BY_ID")
          elif [ -e /dev/disk/by-label/"$LABEL" ]; then
            DEV=$(readlink -f /dev/disk/by-label/"$LABEL")
          fi

          if [ -z "$DEV" ] || [ ! -b "$DEV" ]; then
            echo "ERROR: mirr-volume block device not found within ${TIMEOUT_SECS}s" >&2
            ls -la /dev/disk/by-id/ 2>/dev/null || true
            exit 1
          fi

          # Mount existing filesystem only (do not mkfs).
          mount -o defaults,nofail,discard,noatime "$DEV" "$MNT" || {
            echo "ERROR: failed to mount $DEV on $MNT" >&2
            exit 1
          }
        fi

        # Persist across reboot if fstab entry missing.
        if ! grep -qE "[[:space:]]$MNT[[:space:]]" /etc/fstab 2>/dev/null; then
          # Prefer label for stability if present, else UUID.
          if [ -e /dev/disk/by-label/"$LABEL" ]; then
            echo "LABEL=$LABEL $MNT ext4 defaults,nofail,discard,noatime 0 2" >> /etc/fstab
          else
            UUID=$(blkid -s UUID -o value "$DEV" 2>/dev/null || true)
            if [ -n "$UUID" ]; then
              echo "UUID=$UUID $MNT ext4 defaults,nofail,discard,noatime 0 2" >> /etc/fstab
            fi
          fi
        fi
      fi

      if ! mountpoint -q "$MNT"; then
        echo "ERROR: $MNT is not a mount point after wait/mount" >&2
        exit 1
      fi

      chown -R deploy:deploy "$MNT"
      chmod 750 "$MNT"
      ln -sfn "$MNT" /mnt/mirr_volume
      echo "mirr-volume ready at $MNT (owned by deploy)"
    ' ]

  # Firewall. Only 22/80/443 are open. Redis and the API are never published.
  # (Docker bypasses ufw for ports it publishes, so keep compose ports to caddy only.)
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable

  # 2 GB swap as an OOM safety net.
  - fallocate -l 2G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - [ sh, -c, "echo '/swapfile none swap sw 0 0' >> /etc/fstab" ]
  - sysctl --system

  - systemctl restart docker
  - systemctl enable --now docker fail2ban

  # Lock down SSH ONLY if the deploy user actually got a key, so a failed key
  # copy cannot lock you out. File name sorts first so it wins over 50-cloud-init.conf.
  - [ sh, -c, "if [ -s /home/deploy/.ssh/authorized_keys ]; then printf 'PasswordAuthentication no\\nPermitRootLogin no\\nKbdInteractiveAuthentication no\\n' > /etc/ssh/sshd_config.d/00-mirr-hardening.conf && systemctl restart ssh; fi" ]

  - touch /var/lib/cloud/instance/mirr-bootstrap.done

final_message: "mirr-server bootstrap finished after $UPTIME seconds"
