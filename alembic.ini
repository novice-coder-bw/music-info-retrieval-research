[alembic]
script_location = alembic
prepend_sys_path = .

# Migration URL. In production/preview, set DATABASE_URL (Neon Postgres);
# the fallback below is only used when DATABASE_URL is not exported.
sqlalchemy.url = sqlite:///alembic_local_fallback.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S